name: Static site quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  basic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check entry files, internal links and JSON data
        run: python3 scripts/check-site.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (catalogue)
        run: node scripts/test-catalog.mjs
      - name: Unit tests (recommandation)
        run: node scripts/test-recommendation.mjs
      - name: Unit tests (i18n)
        run: node scripts/test-i18n.mjs
